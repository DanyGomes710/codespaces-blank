<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário de Inscrição</title>
    <style>
      :root {
        --bg: #f6efe8;
        --card: #fffaf5;
        --primary: #a65b2a;
        --primary-dark: #7d3f1b;
        --text: #3a2a1f;
        --muted: #7a6254;
        --border: #d8c0a4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f3e4d7 0%, var(--bg) 100%);
        color: var(--text);
      }

      .container {
        max-width: 700px;
        margin: 48px auto;
        background: var(--card);
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(31, 90, 166, 0.12);
      }

      h1 {
        margin-top: 0;
        margin-bottom: 24px;
        font-size: 2rem;
        color: var(--primary-dark);
        text-align: center;
      }

      form {
        display: grid;
        gap: 20px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      label {
        font-weight: 700;
        color: var(--text);
      }

      input,
      select,
      button {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        font-size: 1rem;
      }

      input:focus,
      select:focus {
        outline: 2px solid rgba(166, 91, 42, 0.18);
        border-color: var(--primary);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
      }

      button {
        cursor: pointer;
        border: none;
        background: var(--primary);
        color: #fff;
        font-weight: 700;
        transition: background 0.2s ease;
      }

      button:hover {
        background: var(--primary-dark);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Inscrição de Curso</h1>

      <form>
        <div class="field">
          <label for="nome">Nome completo</label>
          <input id="nome" name="nome" type="text" placeholder="Digite seu nome completo" required />
        </div>

        <div class="grid">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="seuemail@exemplo.com" required />
          </div>

          <div class="field">
            <label for="idade">Idade</label>
            <input id="idade" name="idade" type="number" min="1" max="120" placeholder="Ex.: 18" required />
          </div>
        </div>

        <div class="field">
          <label for="escolaridade">Escolaridade atual</label>
          <select id="escolaridade" name="escolaridade" required>
            <option value="" selected disabled>Selecione</option>
            <option value="ensino-fundamental-incompleto">Ensino Fundamental incompleto</option>
            <option value="ensino-fundamental-completo">Ensino Fundamental completo</option>
            <option value="ensino-medio-em-andamento">Ensino Médio em andamento</option>
            <option value="ensino-medio-completo">Ensino Médio completo</option>
            <option value="superior-em-andamento">Superior em andamento</option>
            <option value="superior-completo">Superior completo</option>
          </select>
        </div>

        <div class="grid">
          <div class="field">
            <label for="opcao1">Opção 1</label>
            <select id="opcao1" name="opcao1" required>
              <option value="" selected disabled>Selecione o curso</option>
              <option value="gastronomia">Gastronomia</option>
              <option value="panificacao">Panificação</option>
              <option value="hotelaria">Hotelaria</option>
              <option value="informatica">Informática</option>
              <option value="letras">Letras</option>
              <option value="administracao">Administração</option>
              <option value="eventos">Eventos</option>
            </select>
          </div>

          <div class="field">
            <label for="opcao2">Opção 2</label>
            <select id="opcao2" name="opcao2" required>
              <option value="" selected disabled>Selecione o curso</option>
              <option value="gastronomia">Gastronomia</option>
              <option value="panificacao">Panificação</option>
              <option value="hotelaria">Hotelaria</option>
              <option value="informatica">Informática</option>
              <option value="letras">Letras</option>
              <option value="administracao">Administração</option>
              <option value="eventos">Eventos</option>
            </select>
          </div>
        </div>

        <button type="submit">Enviar inscrição</button>
      </form>
    </main>
  </body>
</html>
